<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.full_title %}{{ page.full_title }}{% else %}{{ page.title }} · MSGSS{% endif %}</title>
    <link href="{{ '/style.css' | relative_url }}" rel="stylesheet">
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
    <link rel="icon" href="{{ '/images/favicon-32.png' | relative_url }}" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon.png' | relative_url }}">
  </head>

  <body>
    <header class="site-header">
      <a class="site-name" href="{{ '/' | relative_url }}"><img src="{{ '/images/logo.png' | relative_url }}" alt="" width="56" height="56">MSGSS</a>
      <nav>
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' or page.url == '/index.html' %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/seminar/' | relative_url }}"{% if page.url contains '/seminar/' %} aria-current="page"{% endif %}>Seminar</a>
        <a href="{{ '/events/' | relative_url }}"{% if page.url contains '/events/' %} aria-current="page"{% endif %}>Events</a>
        <a href="{{ '/travel-grant.html' | relative_url }}"{% if page.url == '/travel-grant.html' %} aria-current="page"{% endif %}>Travel Grant</a>
        <a href="{{ '/executive.html' | relative_url }}"{% if page.url == '/executive.html' %} aria-current="page"{% endif %}>Executive</a>
        <a href="{{ '/docs/' | relative_url }}"{% if page.url contains '/docs/' %} aria-current="page"{% endif %}>Documents</a>
      </nav>
    </header>

    <main>
{{ content }}
    </main>

    <footer class="site-footer">
      <a href="mailto:msgss@dal.ca">msgss@dal.ca</a> ·
      <a href="https://www.instagram.com/msgss.dal">Instagram</a> ·
      <a href="https://github.com/msgss-dal">GitHub</a>
    </footer>
  </body>
</html>
