# Jekyll settings for the MSGSS site (GitHub Pages builds the site from these).
title: MSGSS
# Used in search results and link previews.
description: "The Mathematics and Statistics Graduate Students’ Society at Dalhousie University: the weekly grad seminar, social events, and advocacy for MSc and PhD students in mathematics and statistics."
url: "https://msgss-dal.github.io"
timezone: America/Halifax

# Seminar talks: one Markdown file per talk in _talks/.
collections:
  talks:
    output: true
    permalink: /seminar/talks/:name.html
  # Executive: one file per year in _executive/ (not published as pages).
  executive:
    output: false

# Publish talks even when their date is in the future (upcoming talks).
future: true

# Every page uses the site layout (header, nav, footer) unless it says otherwise,
# so a Markdown page only needs a title in its front matter.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
  - scope:
      path: ""
      type: talks
    values:
      layout: talk

# Builds /sitemap.xml so search engines find every page and talk.
plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
